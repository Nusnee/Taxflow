<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxFlow — ตรวจสอบเอกสาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="verify-wrap">
  <div class="verify-card" id="card">
    <div style="text-align:center;color:var(--ink-soft)">กำลังตรวจสอบเอกสาร…</div>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
const TYPE_LABEL = { WHT:'หนังสือรับรองหัก ณ ที่จ่าย', ETAX:'ใบกำกับภาษีอิเล็กทรอนิกส์', EWHT:'หนังสือรับรองหัก ณ ที่จ่าย' };
const ST = { draft:'แบบร่าง', pending:'รอตรวจสอบ', approved:'อนุมัติ', rejected:'ไม่อนุมัติ', cancelled:'ยกเลิก', archived:'เก็บถาวร' };
(async function(){
  const token = new URLSearchParams(location.search).get('token');
  const card = document.getElementById('card');
  if (!token) { card.innerHTML = fail('ไม่พบรหัสตรวจสอบในลิงก์'); return; }
  const r = await fetch('/api/verify/' + token);
  const d = await r.json();
  if (!d.valid) { card.innerHTML = fail(d.error || 'ไม่พบเอกสารนี้ในระบบ'); return; }
  card.innerHTML = `
    <div class="verify-icon ok">✓</div>
    <h2 style="text-align:center;font-size:20px;margin-bottom:4px">เอกสารถูกต้อง มีอยู่ในระบบ</h2>
    <p style="text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:20px">${TYPE_LABEL[d.type]||d.type}</p>
    <div class="kv"><span>เลขที่เอกสาร</span><b class="docno">${d.docNo}</b></div>
    <div class="kv"><span>ผู้ออกเอกสาร</span><b>${d.issuer||'-'}</b></div>
    <div class="kv"><span>คู่ค้า/ลูกค้า</span><b>${d.counterparty||'-'}</b></div>
    <div class="kv"><span>ยอดรวม</span><b>฿${baht(d.total)}</b></div>
    <div class="kv"><span>สถานะ</span><b>${ST[d.status]||d.status}</b></div>
    <div class="kv"><span>วันที่สร้าง</span><b>${new Date(d.createdAt).toLocaleDateString('th-TH')}</b></div>
    ${d.signed ? `<div class="kv"><span>ลายมือชื่อดิจิทัล</span><b style="color:var(--ok)">✓ ลงนามโดย ${d.signerName}<br><small style="font-weight:400;color:var(--ink-soft)">${new Date(d.signedAt).toLocaleString('th-TH')}</small></b></div>` : `<div class="kv"><span>ลายมือชื่อดิจิทัล</span><b style="color:var(--ink-soft)">ยังไม่ลงนาม</b></div>`}
    <p class="muted" style="text-align:center;margin-top:20px;font-size:11.5px">ระบบต้นแบบ TaxFlow เพื่อการศึกษา</p>`;
})();
function fail(msg){
  return `<div class="verify-icon bad">✕</div>
  <h2 style="text-align:center;font-size:20px;margin-bottom:8px">ตรวจสอบไม่สำเร็จ</h2>
  <p style="text-align:center;color:var(--ink-soft)">${msg}</p>`;
}
</script>
</body>
</html>
